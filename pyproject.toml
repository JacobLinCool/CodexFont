[project]
name = "codexfont"
version = "0.1.0"
description = "Reproducible original-glyph design, QA, and release pipeline for Codex Font families"
requires-python = ">=3.11,<3.13"
dependencies = [
  "brotli==1.1.0",
  "fonttools[woff]==4.60.1",
  "freetype-py==2.5.1",
  "numpy==1.26.4",
  "pillow==12.0.0",
  "reportlab==4.4.4",
  "scikit-image==0.24.0",
  "scipy==1.17.1",
  "skia-pathops==0.9.2",
  "uharfbuzz==0.52.0",
]

[dependency-groups]
dev = [
  "pytest==8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
